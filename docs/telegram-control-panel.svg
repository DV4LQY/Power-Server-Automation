<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Telegram server control panel mockup</title>
  <desc id="description">A Telegram-style chat screen for the ICTU Server Control Bot with buttons for Server Status, Schedule, Turn ON, Turn OFF, Send SLA Graph, and Help.</desc>
  <rect width="1200" height="660" fill="#edf3f7"/>
  <rect x="190" y="34" width="820" height="592" rx="28" fill="#ffffff" stroke="#c7d4dc" stroke-width="3"/>
  <path d="M190 62a28 28 0 0 1 28-28h764a28 28 0 0 1 28 28v83H190z" fill="#229ed9"/>
  <circle cx="246" cy="96" r="27" fill="#ffffff" opacity=".95"/>
  <path d="m231 95 33-14c5-2 7 0 5 6l-12 39c-1 5-4 6-8 4l-14-10-7 7c-1 1-2 1-3 1l1-15 27-25c1-1 0-2-2-1l-33 21z" fill="#229ed9"/>
  <text x="291" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">ICTU Server Control Bot</text>
  <text x="291" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dff3ff">online</text>
  <rect x="226" y="144" width="748" height="438" rx="20" fill="#dfeaf0"/>
  <path d="M282 188h460a18 18 0 0 1 18 18v94a18 18 0 0 1-18 18H304l-32 24 8-24a18 18 0 0 1-16-18v-94a18 18 0 0 1 18-18z" fill="#ffffff"/>
  <text x="306" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">SERVER CONTROL PANEL</text>
  <text x="306" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#475569">Select an action:</text>
  <text x="772" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">10:42 AM</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#176a95">
    <rect x="280" y="371" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="427" y="411" text-anchor="middle">Server Status</text>
    <rect x="626" y="371" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="773" y="411" text-anchor="middle">Schedule</text>
    <rect x="280" y="453" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="427" y="493" text-anchor="middle">Turn ON</text>
    <rect x="626" y="453" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="773" y="493" text-anchor="middle">Turn OFF</text>
    <rect x="280" y="535" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="427" y="575" text-anchor="middle">Send SLA Graph</text>
    <rect x="626" y="535" width="294" height="62" rx="13" fill="#ffffff" stroke="#b6cfdb" stroke-width="2"/>
    <text x="773" y="575" text-anchor="middle">Help</text>
  </g>
  <text x="600" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#64748b">Illustrative inline keyboard based on the bot interface implemented in this repository</text>
</svg>
